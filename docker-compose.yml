# Real-time trending products and GMV: Kafka -> Flink 2 -> Redis -> web dashboard.
#   docker compose up -d --build        dashboard: http://localhost:8088   Flink UI: http://localhost:8081
#   docker compose --profile ui up -d   adds Kafka UI on http://localhost:8080
x-app: &app
  image: flink-kafka-redis-demo:local
  build: .
  environment: &env
    KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    KAFKA_TOPIC: user-events
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    TOP_N: "10"
    TRENDING_WINDOW: 60s
    TRENDING_SLIDE: 5s
    GMV_WINDOW: 10s
    MAX_OUT_OF_ORDERNESS: 5s
    EVENTS_PER_SECOND: ${EVENTS_PER_SECOND:-50}
    LATE_EVENT_RATIO: "0.05"

x-flink-properties: &flink-properties |
  jobmanager.rpc.address: jobmanager
  parallelism.default: 2
  taskmanager.numberOfTaskSlots: 2
  jobmanager.memory.process.size: 1024m
  taskmanager.memory.process.size: 1536m
  state.checkpoints.dir: file:///opt/flink/checkpoints
  execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION

services:
  kafka:
    image: apache/kafka:4.2.1
    ports:
      - "9092:9092" # for clients on the host
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  producer:
    <<: *app
    command: ["/opt/flink/bin/app.sh", "producer"]
    environment:
      <<: *env
      JAVA_OPTS: -Xmx256m
    depends_on:
      kafka: { condition: service_healthy }
    restart: unless-stopped

  # Application mode: the JobManager runs TrendingJob from the jar in /opt/flink/usrlib.
  jobmanager:
    <<: *app
    command: ["standalone-job", "--job-classname", "io.github.tomdong2010.fkr.job.TrendingJob"]
    ports:
      - "8081:8081"
    environment:
      <<: *env
      FLINK_PROPERTIES: *flink-properties
    volumes:
      - checkpoints:/opt/flink/checkpoints
    depends_on:
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  taskmanager:
    <<: *app
    command: ["taskmanager"]
    environment:
      FLINK_PROPERTIES: *flink-properties
    volumes:
      - checkpoints:/opt/flink/checkpoints
    depends_on:
      - jobmanager
    restart: unless-stopped

  dashboard:
    <<: *app
    command: ["/opt/flink/bin/app.sh", "dashboard"]
    environment:
      <<: *env
      JAVA_OPTS: -Xmx256m
    ports:
      - "8088:8088"
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped

  kafka-ui:
    image: kafbat/kafka-ui:latest
    profiles: [ui]
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka: { condition: service_healthy }

volumes:
  checkpoints:
